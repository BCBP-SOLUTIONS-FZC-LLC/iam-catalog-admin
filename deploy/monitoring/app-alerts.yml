# Static mirror of deploy/helm/templates/prometheusrule.yaml, for manual
# `--rule-files` deployment on a Prometheus instance that isn't using the
# prometheus-operator ServiceMonitor/PrometheusRule CRDs. Keep in sync by
# hand — there is no sync script for a chart this size (mirrors
# iam-catalog-admin's own docs/architecture/README.md precedent for
# deliberately not automating something only this small).
groups:
  - name: catalog_admin_availability
    rules:
      - alert: IAMCatalogAdminDown
        expr: absent(up{job="iam-catalog-admin"} == 1)
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-catalog-admin has no healthy instances
          description: >-
            No iam-catalog-admin pods have been scraped as healthy for 2 minutes.
            Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-catalog-admin

      - alert: IAMCatalogAdminReplicasMissing
        expr: sum(up{job="iam-catalog-admin"}) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-catalog-admin running below its 2-replica baseline
          description: >-
            Fewer than 2 replicas are healthy. Current healthy count: {{ $value }}.
            A further disruption would take the service to zero.

  - name: catalog_admin_errors
    rules:
      - alert: IAMCatalogAdminHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="iam-catalog-admin", status_class="5xx"}[5m]))
            /
          sum(rate(http_requests_total{job="iam-catalog-admin"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-catalog-admin 5xx error rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of requests are returning 5xx errors
            over the last 5 minutes. Investigate recent deployments and dependency
            health (Postgres, Valkey).

      - alert: IAMCatalogAdminCriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job="iam-catalog-admin", status_class="5xx"}[5m]))
            /
          sum(rate(http_requests_total{job="iam-catalog-admin"}[5m]))
          > 0.20
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-catalog-admin 5xx error rate above 20%
          description: >-
            {{ $value | humanizePercentage }} of requests are returning 5xx errors.
            Escalate immediately — every CAT-I1/CAT-I2 consumer (Core, Group Mapping)
            degrades to a stale-if-error cache read while this service is down.

      # LLD §11.5: "CAT-I1/CAT-I2 error rate > 10% over 5 minutes" (SEV-2) —
      # distinct from the two all-route alerts above, which don't isolate
      # the internal/bulk-read routes Core and Group Mapping depend on for
      # cache population. Uses catalog_admin_requests_total (§11.2's own
      # route+exact-status metric), not the generic http_requests_total.
      - alert: IAMCatalogAdminInternalErrorRate
        expr: |
          sum(rate(catalog_admin_requests_total{job="iam-catalog-admin", route=~"/api/v1/internal/.*", status=~"5.."}[5m]))
            /
          sum(rate(catalog_admin_requests_total{job="iam-catalog-admin", route=~"/api/v1/internal/.*"}[5m]))
          > 0.10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-catalog-admin CAT-I1/CAT-I2 error rate above 10%
          description: >-
            {{ $value | humanizePercentage }} of CAT-I1 (bulk departments)/CAT-I2
            (bulk plans) calls are erroring over the last 5 minutes (LLD §11.5, SEV-2).
            Every consumer's cache-population path (Core, Group Mapping) is degraded
            simultaneously — investigate immediately, not just this service's own health.

  - name: catalog_admin_latency
    rules:
      - alert: IAMCatalogAdminHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="iam-catalog-admin"}[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-catalog-admin p99 latency above 250ms
          description: >-
            The p99 request duration is {{ $value | humanizeDuration }}, well above
            the 100ms p99 write / 40ms p99 read SLOs (LLD §11.1).

      - alert: IAMCatalogAdminCriticalLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="iam-catalog-admin"}[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-catalog-admin p99 latency above 1s
          description: >-
            The p99 request duration is {{ $value | humanizeDuration }}. Points at
            Postgres or Valkey degradation, not this service's own logic.

  - name: catalog_admin_writes
    rules:
      # LLD §11.5: "Optimistic-lock-conflict rate on CAT-2/CAT-5 sustained
      # > 0 for > 15 minutes" — writes are rare enough (§2) that ANY
      # sustained nonzero rate is itself diagnostic of a caller retry-storm
      # or tooling bug, not expected in steady state.
      - alert: IAMCatalogAdminOptimisticLockConflicts
        expr: |
          sum(rate(catalog_admin_optimistic_lock_conflicts_total{job="iam-catalog-admin"}[5m])) by (table) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-catalog-admin sustained optimistic-lock conflicts on {{ $labels.table }}
          description: >-
            CAT-2/CAT-5 writes to {{ $labels.table }} have been hitting
            409 optimistic_lock_conflict for over 15 minutes. Writes are rare enough
            (LLD §2) that a sustained rate points at a caller retry-storm or tooling
            bug, not expected contention.
