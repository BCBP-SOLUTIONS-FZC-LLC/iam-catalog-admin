{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam-catalog-admin.fullname" . }}
  labels:
    {{- include "iam-catalog-admin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iam-catalog-admin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow API traffic from the ingress controller / gateway namespace.
    # For Envoy Gateway the data-plane pods run in the same namespace as the
    # Gateway resource; set ingressControllerNamespaceSelector to that namespace
    # label and ingressControllerPodSelector to the Envoy pod labels.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow internal service-to-service traffic within the same namespace
    # (CAT-I1/CAT-I2, mesh-only — LLD §7, §9).
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow Prometheus to scrape :9090/metrics — restricted to the
    # monitoring namespace. Metrics live on a SEPARATE port from the API,
    # so this rule (unlike the two above) does not grant any API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow PostgreSQL / PgBouncer connections — this service's only
    # required dependency besides Valkey (LLD §4's leaf-service property:
    # no outbound calls to any other IAM service, no AWS SDK usage).
    - ports:
        - port: 5432
          protocol: TCP
        - port: 5433
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections.
    - ports:
        - port: 6379
          protocol: TCP

    # Allow OTel OTLP gRPC to the collector (opt-in — OTEL_EXPORTER_OTLP_ENDPOINT).
    - ports:
        - port: 4317
          protocol: TCP

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
