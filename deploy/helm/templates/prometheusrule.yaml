{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "iam-catalog-admin.fullname" . }}
  labels:
    {{- include "iam-catalog-admin.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: catalog_admin_availability
      rules:
        - alert: IAMCatalogAdminDown
          expr: |
            absent(up{job={{ include "iam-catalog-admin.fullname" . | quote }}} == 1)
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin has no healthy instances
            description: >-
              No iam-catalog-admin pods have been scraped as healthy for 2 minutes.
              Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-catalog-admin

        - alert: IAMCatalogAdminReplicasMissing
          # replicaCount: 2 (LLD §16.1) — losing even one pod halves this
          # service's already-minimal capacity and removes the PDB's
          # remaining disruption budget (minAvailable: 1).
          expr: |
            sum(up{job={{ include "iam-catalog-admin.fullname" . | quote }}}) < 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin running below its 2-replica baseline
            description: >-
              Fewer than 2 replicas are healthy. Current healthy count: {{ "{{ $value }}" }}.
              A further disruption would take the service to zero.

    - name: catalog_admin_errors
      rules:
        - alert: IAMCatalogAdminHighErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin 5xx error rate above 5%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors
              over the last 5 minutes. Investigate recent deployments and dependency
              health (Postgres, Valkey) — this is a leaf service with no downstream
              IAM-service calls (LLD §4), so a 5xx here is either this service or its
              own DB/cache.

        - alert: IAMCatalogAdminCriticalErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m]))
            > 0.20
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin 5xx error rate above 20%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors.
              This exceeds the critical threshold. Escalate immediately — every
              CAT-I1/CAT-I2 consumer (Core, Group Mapping) degrades to a stale-if-error
              cache read while this service is down.

        # LLD §13.5: "CAT-I1/CAT-I2 error rate > 10% over 5 minutes" (SEV-2)
        # — distinct from the two all-route alerts above, which don't
        # isolate the internal/bulk-read routes Core and Group Mapping
        # depend on for cache population. Uses catalog_admin_requests_total
        # (§13.2's own route+exact-status metric), not the generic
        # http_requests_total the other alerts in this group use.
        - alert: IAMCatalogAdminInternalErrorRate
          expr: |
            sum(rate(catalog_admin_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, route=~"/api/v1/internal/.*", status=~"5.."}[5m]))
              /
            sum(rate(catalog_admin_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, route=~"/api/v1/internal/.*"}[5m]))
            > 0.10
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin CAT-I1/CAT-I2 error rate above 10%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of CAT-I1 (bulk departments)/CAT-I2
              (bulk plans) calls are erroring over the last 5 minutes (LLD §13.5, SEV-2).
              Every consumer's cache-population path (Core, Group Mapping) is degraded
              simultaneously — investigate immediately, not just this service's own health.

    - name: catalog_admin_latency
      rules:
        # LLD §13.1's tightest SLOs are 15ms/40ms p99 (cache hit/miss reads)
        # and 100ms p99 (writes) — these are proposed, unconfirmed figures
        # (CAT-Q5). The thresholds below are set with headroom above the
        # loosest stated SLO rather than at the SLO itself, so this alert
        # catches a real regression without paging on ordinary variance.
        - alert: IAMCatalogAdminHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m])
              )
            ) > 0.25
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin p99 latency above 250ms
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}, well above
              the 100ms p99 write / 40ms p99 read SLOs (LLD §13.1). Check slow-query
              logs (PG_SLOW_QUERY_THRESHOLD) and the cat:departments/cat:plans cache
              hit ratio (catalog_admin_cache_hits_total / catalog_admin_cache_misses_total).

        - alert: IAMCatalogAdminCriticalLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m])
              )
            ) > 1.0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin p99 latency above 1s
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}. For a
              single-row read/write service with no downstream synchronous calls
              (LLD §4), this points at Postgres or Valkey degradation, not this
              service's own logic.

    - name: catalog_admin_writes
      rules:
        # LLD §13.5: "Optimistic-lock-conflict rate on CAT-2/CAT-5 sustained
        # > 0 for > 15 minutes" — writes are rare enough (§1) that ANY
        # sustained nonzero rate is itself diagnostic of a caller retry-storm
        # or tooling bug, not expected in steady state.
        - alert: IAMCatalogAdminOptimisticLockConflicts
          expr: |
            sum(rate(catalog_admin_optimistic_lock_conflicts_total{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m])) by (table) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin sustained optimistic-lock conflicts on {{ "{{ $labels.table }}" }}
            description: >-
              CAT-2/CAT-5 writes to {{ "{{ $labels.table }}" }} have been hitting
              409 optimistic_lock_conflict for over 15 minutes. Writes are rare enough
              (LLD §1) that a sustained rate points at a caller retry-storm or tooling
              bug, not expected contention.
{{- end }}
