{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "iam-catalog-admin.fullname" . }}
  labels:
    {{- include "iam-catalog-admin.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: catadmin_availability
      rules:
        - alert: IAMCatalogAdminDown
          expr: |
            absent(up{job={{ include "iam-catalog-admin.fullname" . | quote }}} == 1)
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin has no healthy instances
            description: >-
              No iam-catalog-admin pods have been scraped as healthy for 2 minutes.
              Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-catalog-admin

        - alert: IAMCatalogAdminReplicasMissing
          # replicaCount: 2 (LLD §16.1) — losing even one pod halves this
          # service's already-minimal capacity and removes the PDB's
          # remaining disruption budget (minAvailable: 1).
          expr: |
            sum(up{job={{ include "iam-catalog-admin.fullname" . | quote }}}) < 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin running below its 2-replica baseline
            description: >-
              Fewer than 2 replicas are healthy. Current healthy count: {{ "{{ $value }}" }}.
              A further disruption would take the service to zero.

    - name: catadmin_errors
      rules:
        - alert: IAMCatalogAdminHighErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin 5xx error rate above 5%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors
              over the last 5 minutes. Investigate recent deployments and dependency
              health (Postgres, Valkey) — this is a leaf service with no downstream
              IAM-service calls (LLD §4), so a 5xx here is either this service or its
              own DB/cache.

        - alert: IAMCatalogAdminCriticalErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum(rate(http_requests_total{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m]))
            > 0.20
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin 5xx error rate above 20%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors.
              This exceeds the critical threshold. Escalate immediately — every
              CAT-I1/CAT-I2 consumer (Core, Group Mapping) degrades to a stale-if-error
              cache read while this service is down.

    - name: catadmin_latency
      rules:
        # LLD §13.1's tightest SLOs are 15ms/40ms p99 (cache hit/miss reads)
        # and 100ms p99 (writes) — these are proposed, unconfirmed figures
        # (CAT-Q5). The thresholds below are set with headroom above the
        # loosest stated SLO rather than at the SLO itself, so this alert
        # catches a real regression without paging on ordinary variance.
        - alert: IAMCatalogAdminHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m])
              )
            ) > 0.25
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-catalog-admin p99 latency above 250ms
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}, well above
              the 100ms p99 write / 40ms p99 read SLOs (LLD §13.1). Check slow-query
              logs (PG_SLOW_QUERY_THRESHOLD) and the cat:departments/cat:plans cache
              hit ratio (catadmin_cache_hits_total / catadmin_cache_misses_total).

        - alert: IAMCatalogAdminCriticalLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job={{ include "iam-catalog-admin.fullname" . | quote }}}[5m])
              )
            ) > 1.0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-catalog-admin p99 latency above 1s
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}. For a
              single-row read/write service with no downstream synchronous calls
              (LLD §4), this points at Postgres or Valkey degradation, not this
              service's own logic.
{{- end }}
