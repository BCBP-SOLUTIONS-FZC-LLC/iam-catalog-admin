# Reusable workflow — quality gate.
# fmt · tidy · vet · lint · vuln-check.
# Called by ci.yml and release.yml. Must pass before push/release; does NOT
# gate coverage, trivy, or smoke (those only need validate-test.yml).
#
# Ported unchanged from iam-user-profile's validate-quality.yml — fully
# generic, no domain-specific steps. Note: this repo's `make lint` is
# currently an alias for `make vet` (no golangci-lint config yet), so the
# Lint step below is not yet a stronger check than Vet — see Makefile.
name: Validate / Quality

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Workflow files must use literal operators, not HTML entity encodings.
      - name: Reject HTML-escaped operators in workflow files
        run: |
          if grep -REn '&(gt|lt|amp)' .github/workflows/ .github/scripts/; then
            echo "::error::Workflow or script files contain HTML entities. Use literal operators instead."
            exit 1
          fi

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" | while IFS= read -r f; do
              echo "::error file=${f},title=Format check::Not formatted — run 'make fmt'"
            done
            exit 1
          fi

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: |
          if ! make vuln-check; then
            echo "::error file=go.mod,title=Vulnerability found::govulncheck detected vulnerabilities — run 'make vuln-check' locally to view details."
            exit 1
          fi

      # Enforce the Enterprise Platform Observability Standard — namespace
      # classification, counter/histogram suffix rules, high-cardinality label
      # prohibition, and deprecated-metric documentation requirements.
      - name: Metrics naming compliance
        run: |
          if ! python3 scripts/validate_metrics.py; then
            echo "::error file=internal/adapter/outbound/metrics/metrics.go,title=Metrics standard violation::One or more metrics violate the Enterprise Platform Observability Standard. Run 'make validate-metrics' locally to view details."
            exit 1
          fi

      # Enforce digest-pinned FROM lines in the Dockerfile. Floating tags (e.g.
      # golang:1.26.5-alpine without @sha256:...) can be silently overwritten by
      # upstream maintainers, breaking supply-chain guarantees.
      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26.5-alpine@sha256:...)."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."
