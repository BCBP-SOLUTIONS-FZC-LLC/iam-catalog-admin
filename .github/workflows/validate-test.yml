# Reusable workflow — test gate.
# Race detector (unit · postgres · e2e) + coverage + architecture lint + Swagger
# staleness check. Called by ci.yml and release.yml. Gates trivy and smoke.
#
# Trimmed from iam-org-membership's/iam-user-profile's validate-test.yml: no
# event-schema sync check (no api/asyncapi.yaml, no internal/adapter/outbound/eventbus/
# — this service publishes no events, LLD §7/CAT-EVT-1..5). The Swagger
# staleness check IS kept — this service ships docs/swagger/ (make swag /
# make swag-check) just like iam-org-membership does.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      # Store credentials so go mod download can fetch private BCBP modules.
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Mandatory blocking gate: runs the full test suite with -race and coverage.
      # Any data race detected here blocks all downstream jobs (trivy, smoke,
      # push, release). Do NOT remove or skip.
      - name: Tests — unit · postgres · e2e (race + coverage)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-ci

      # make test-ci already merges all three coverage profiles into coverage.out
      # via _merge-coverage. 98% is this service's own established baseline
      # (not iam-user-profile's 95% — this is a much smaller surface with no
      # outbox/RLS/event machinery to leave deliberately uncovered).
      - name: Coverage threshold gate (≥ 98%)
        id: gate
        env:
          COVERAGE_THRESHOLD: '98'
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

      # Enforces the hexagonal dependency rules defined in .go-arch-lint.yml
      # (LLD §4.2): domain imports nothing internal, port imports only
      # domain, service imports only domain+port, adapters implement port
      # and use domain types, nothing in core/ imports adapter/.
      - name: Cache go-arch-lint binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: go-arch-lint-${{ runner.os }}-v1.15.0

      - name: Architecture lint
        run: bash .github/scripts/arch-lint.sh

      # Regenerates Swagger docs from handler annotations and fails if the
      # committed artefacts (docs/swagger/) are stale. `make swag`/`make
      # swag-check` were previously documented (CLAUDE.md, Makefile) as a
      # "CI drift gate" but no workflow actually invoked
      # check-swagger-stale.sh — closing that gap here, matching
      # iam-org-membership's equivalent step.
      - name: Swagger staleness check
        run: bash .github/scripts/check-swagger-stale.sh
