version: 3
workdir: .

allow:
  depOnAnyVendor: true
  # Deep-scan follows method calls through the composition root and flags
  # every DI wire (e.g. cmd passing an outbound adapter to a service
  # constructor) as a cross-layer dependency. That's how Clean Architecture
  # is supposed to work in main.go — keep import-level checks only.
  deepScan: false

# Tests, dev scripts, and deploy manifests are not part of the runtime
# architecture. Excluding them keeps the linter focused on production code.
exclude:
  - test
  - scripts
  - deploy

excludeFiles:
  - '.*_test\.go$'

components:
  domain:
    in: internal/core/domain

  port:
    in: internal/core/port

  service:
    in: internal/core/service

  requestctx:
    in: pkg/requestctx

  # Cross-cutting Prometheus counters (LLD §13.2). Imported by both the
  # inbound HTTP adapter and the outbound valkey adapter.
  observability:
    in: internal/adapter/outbound/metrics

  adapters_inbound:
    in:
      - internal/adapter/inbound/http

  adapters_outbound:
    in:
      - internal/adapter/outbound/postgres
      - internal/adapter/outbound/valkey

  # Generated Swagger docs — output of `make swag` (swaggo/swag). Declared as
  # a component so arch-lint doesn't fail on the blank import in
  # cmd/catalog-admin-config/main.go.
  docs_swagger:
    in: docs/swagger

  cmd:
    in:
      - cmd/catalog-admin-config

deps:
  # domain: no internal imports at all — pure value types only (LLD §4.2).
  domain:
    anyVendorDeps: true

  # port: only domain (LLD §4.2).
  port:
    mayDependOn:
      - domain

  # service: domain + port (LLD §4.2).
  service:
    mayDependOn:
      - domain
      - port

  # requestctx: no internal deps.
  requestctx:
    anyVendorDeps: true

  # observability: instrumentation only, no internal deps.
  observability:
    anyVendorDeps: true

  # inbound adapters: service + port + domain + requestctx + observability
  # (LLD §4.2 — "adapter/* implements core/port and uses core/domain types").
  adapters_inbound:
    mayDependOn:
      - service
      - port
      - domain
      - requestctx
      - observability

  # outbound adapters: port + domain + observability (valkey's cache-hit/
  # -miss counters).
  adapters_outbound:
    mayDependOn:
      - port
      - domain
      - observability

  # docs_swagger: pure generated assets, no internal deps.
  docs_swagger:
    anyVendorDeps: true

  # composition root: wires everything.
  cmd:
    mayDependOn:
      - domain
      - port
      - service
      - requestctx
      - observability
      - adapters_inbound
      - adapters_outbound
      - docs_swagger
